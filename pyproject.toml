[project]
name = "tuican"
version = "0.1.0"
authors = [
    { name="G0-G4"},
]
description = "A Python library for building interactive Telegram bot interfaces with reusable UI components."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.4",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
exclude = ["tests/", "examples/"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/G0-G4/TUIcan/tree/main"
